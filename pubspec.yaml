name: ssid_finder
description: Chipa SSID Finder - Extract session tokens from trading platforms with ease. Supports OlympTrade, PocketOptions, Axiom Trade, and more.
publish_to: 'none'
version: 1.0.0+1

# App metadata for stores
homepage: https://github.com/theshadow76/Chipa-SSID-Finder

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.0
  shared_preferences: ^2.5.0
  google_fonts: ^6.2.0
  provider: ^6.1.1
  window_manager: ^0.3.9
  fl_chart: ^0.66.2
  font_awesome_flutter: ^10.9.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
